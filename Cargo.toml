[package]
name = "dndtui"
version = "0.1.0"
description = "A TUI to for managing combats as a DM and looking up monsters."
authors = ["Andreas Schlager <andreas.schlager@stud.plus.ac.at>"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
color-eyre = "0.6.5"
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
thiserror = "2.0.21"
tui-input = "0.15.5"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
